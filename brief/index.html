  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('The sourcing layer, in four parts');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('The sourcing layer, in four parts');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

   /* optional editorial accent only */\n  --font-mono: ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* ---- Weights ---- */\n  --fw-regular: 400;   /* @kind font */\n  --fw-medium: 500;    /* @kind font */\n  --fw-semibold: 600;  /* @kind font */\n  --fw-bold: 700;      /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n\n  /* ---- Type scale (px) — product UI, sourced live ---- */\n  --text-display: 48px;   /* H1 / display — Inter 700 */\n  --text-h2: 36px;\n  --text-h3: 24px;\n  --text-h4: 20px;        /* card title 18–20 */\n  --text-body: 16px;\n  --text-small: 14px;     /* small / meta */\n  --text-micro: 11px;     /* overline / micro-label */\n\n  /* ---- Line heights ---- */\n  --lh-display: 1.04;  /* @kind font */\n  --lh-heading: 1.15;  /* @kind font */\n  --lh-body: 1.55;     /* @kind font */\n  --lh-tight: 1.3;     /* @kind font */\n\n  /* ---- Tracking — negative grows with display size (Notion cadence) ---- */\n  --tracking-display: -1.5px;   /* @kind font */\n  --tracking-heading: -0.6px;   /* @kind font */\n  --tracking-tight: -0.3px;     /* @kind font */\n  --tracking-normal: 0;         /* @kind font */\n  --tracking-label: 0.08em;     /* @kind font */\n}\n\n/* ---- Signature overline / micro-label utility (stays uppercase — Startt's own) ---- */\n.startt-overline {\n  font-family: var(--font-sans);\n  font-size: var(--text-micro);\n  font-weight: var(--fw-semibold);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-label);\n  text-transform: uppercase;\n  color: var(--muted-foreground-strong);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Startt, Color tokens  (design.md §4, §14)\n   One gold accent on a calm, high-contrast canvas.\n   Two product themes: Midnight (dark, default) + Parchment (light).\n   ============================================================ */\n\n:root {\n  /* ---- Brand constants (never theme-swap) ---- */\n  --brand-gold: #FACC15;        /* master brand gold, exact logo vector (yellow-400) */\n  --ui-gold: #eab308;           /* current in-product gold (yellow-500), converging to brand */\n  --gold-hover: #facc15;\n  --gold-active: #854d0e;\n  --gold-text-dark: #ca8a04;    /* gold AS TEXT on dark surfaces */\n  --gold-text-light: #854d0e;   /* gold AS TEXT on light surfaces */\n  --foreground-on-gold: #262624;/* text/icons on a gold fill, always ink, never white */\n\n  --ink: #262624;               /* warm near-black */\n  --parchment: #ede9dd;         /* product light canvas */\n  --midnight: #09090b;          /* product dark canvas */\n  --brand-dark: #020617;        /* slate-950, the logo's own dark; canonical brand near-black */\n  --deck-dark: #101010;\n  --deck-light: #f7f7f7;\n\n  /* ---- Semantic status (shared) ---- */\n  --destructive: #ef4444;\n  --warning: #f59e0b;\n  --warning-active: #92400e;\n  --success: #22c55e;\n  --live: #22c55e;\n  --info: #60a5fa;\n\n  /* ---- Categorical data-viz series (design.md §4.6) ---- */\n  --chart-1: #3b82f6;  /* blue , Dealflow */\n  --chart-2: #22c55e;  /* green */\n  --chart-3: #a855f7;  /* purple */\n  --chart-4: #f97316;  /* orange */\n  --chart-5: #06b6d4;  /* cyan */\n  --dim-dealflow: #3b82f6;\n  --dim-radar: #6d28d9;\n\n  /* ---- Tag / badge palette, light values (design.md §4.5) ---- */\n  --tag-blue: #1d4ed8;\n  --tag-cyan: #0e7490;\n  --tag-emerald: #047857;\n  --tag-rose: #be123c;\n  --tag-violet: #6d28d9;\n  /* dark-surface lifts */\n  --tag-blue-dark: #60a5fa;\n  --tag-cyan-dark: #22d3ee;\n  --tag-emerald-dark: #34d399;\n  --tag-rose-dark: #fb7185;\n  --tag-violet-dark: #a78bfa;\n}\n\n/* ===========================================================\n   LIGHT, \"Parchment\" (product)\n   =========================================================== */\n:root,\n.light {\n  --background: #ede9dd;\n  --foreground: #262624;\n  --card: #ede9dd;\n  --card-foreground: #262624;\n  --popover: #ffffff;\n  --popover-foreground: #262624;\n\n  --primary: #eab308;\n  --primary-foreground: #262624;\n  --primary-hover: #facc15;\n  --primary-active: #854d0e;\n  --primary-text: #854d0e;        /* gold-as-text on light */\n\n  --secondary: #e4dfd1;\n  --secondary-foreground: #262624;\n  --accent: #e4dfd1;\n\n  --muted: #2626240f;             /* ~6% ink wash */\n  --muted-foreground: #87867f;    /* large / secondary text only (§13) */\n  --muted-foreground-strong: #6a695f; /* small muted text on parchment (AA) */\n\n  --border: #2626241f;            /* ~12% ink */\n  --input: #26262438;             /* ~22% ink */\n  --ring: #eab30873;              /* gold @ ~45% */\n\n  --nav-surface: #ede9dd;\n  --table-header: #ede9dd;\n\n  --shadow-sm: 0 1px 3px rgba(0,0,0,.1);\n  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1);\n  --shadow-elevated: 0 25px 50px -12px rgba(38,38,36,.18);\n\n  color-scheme: light;\n}\n\n/* ===========================================================\n   DARK, \"Midnight\" (product default)\n   =========================================================== */\n.dark {\n  --background: #09090b;\n  --foreground: #f4f4f5;\n  --card: #18181b;\n  --card-foreground: #f4f4f5;\n  --popover: #18181b;\n  --popover-foreground: #f4f4f5;\n  --surface-raised: #27272a;\n\n  --primary: #eab308;\n  --primary-foreground: #262624;\n  --primary-hover: #facc15;\n  --primary-active: #854d0e;\n  --primary-text: #ca8a04;        /* gold-as-text on dark */\n\n  --secondary: #27272a;\n  --secondary-foreground: #f4f4f5;\n  --accent: #27272a;\n\n  --muted: #ffffff0f;\n  --muted-foreground: #a1a1aa;    /* passes AA on midnight */\n  --muted-foreground-strong: #a1a1aa;\n\n  --border: #27272a;\n  --input: #3f3f46;\n  --ring: #eab30873;\n\n  --nav-surface: #18181b;\n  --table-header: #18181b;\n\n  --shadow-sm: 0 1px 3px rgba(0,0,0,.4);\n  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.5);\n  --shadow-elevated: 0 25px 50px -12px rgba(0,0,0,.6);\n\n  color-scheme: dark;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Startt, Spacing, radius & elevation tokens  (design.md §6)\n   4px base grid. Multiples of 4 only.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4px base): 4 8 12 16 20 24 32 40 48 64 ---- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n\n  /* component padding 12–16; section padding 48–64+ */\n  --pad-control: 12px;\n  --pad-card: 20px;\n  --pad-section: 48px;\n\n  /* ---- Radius ---- */\n  --radius: 0.25rem;      /* 4px, buttons, inputs, tags */\n  --radius-md: 8px;       /* popovers */\n  --radius-card: 12px;    /* cards */\n  --radius-lg: 16px;      /* feature cards */\n  --radius-xl: 24px;      /* hero / marketing containers */\n  --radius-full: 9999px;  /* pills, avatars, badge coin, Live chip */\n\n  /* ---- Elevation ---- */\n  --shadow-sm: 0 1px 3px rgba(0,0,0,.1);\n  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1);\n  --shadow-elevated: 0 25px 50px -12px rgba(38,38,36,.18);\n\n  /* ---- Motion (design.md §10) ---- */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);  /* @kind other */\n  --dur-enter: 200ms;   /* @kind other */\n  --dur-hover: 120ms;   /* @kind other */\n\n  /* ---- Layout ---- */\n  --rail-width: 64px;         /* @kind spacing */\n  --container-max: 1200px;    /* @kind spacing */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Startt, Component styles\n   Class-based, token-referencing. Ships to consumers via styles.css.\n   Prefix: st-  ·  Themes via .dark / .light ancestor.\n   ============================================================ */\n\n/* ---- Signature overline / micro-label ---- */\n.st-overline{font-family:var(--font-sans);font-size:var(--text-micro);font-weight:var(--fw-semibold);line-height:var(--lh-tight);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--muted-foreground-strong);margin:0}\n\n/* ============================================================\n   BUTTONS\n   ============================================================ */\n.st-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-sans);font-weight:var(--fw-semibold);border:1px solid transparent;border-radius:var(--radius);cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1;transition:background var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out),border-color var(--dur-hover) var(--ease-out),transform var(--dur-hover) var(--ease-out);-webkit-user-select:none;user-select:none}\n.st-btn__label{display:inline-block}\n.st-btn__icon{display:inline-flex;align-items:center;justify-content:center}\n.st-btn__icon svg{width:1.15em;height:1.15em;display:block}\n/* sizes */\n.st-btn--sm{height:32px;padding:0 12px;font-size:13px}\n.st-btn--md{height:40px;padding:0 16px;font-size:14px}\n.st-btn--lg{height:48px;padding:0 22px;font-size:15px}\n.st-btn--block{width:100%}\n/* primary, the one gold moment */\n.st-btn--primary{background:var(--primary);color:var(--primary-foreground)}\n.st-btn--primary:hover{background:var(--primary-hover)}\n.st-btn--primary:active{background:var(--primary-active);color:#fff}\n/* secondary, neutral */\n.st-btn--secondary{background:var(--secondary);color:var(--secondary-foreground)}\n.st-btn--secondary:hover{background:color-mix(in srgb,var(--secondary) 82%,var(--foreground))}\n/* soft / tonal gold */\n.st-btn--soft{background:color-mix(in srgb,var(--primary) 20%,transparent);color:var(--primary-text)}\n.st-btn--soft:hover{background:color-mix(in srgb,var(--primary) 30%,transparent)}\n/* ghost */\n.st-btn--ghost{background:transparent;color:var(--muted-foreground)}\n.st-btn--ghost:hover{background:var(--muted);color:var(--foreground)}\n/* focus + disabled */\n.st-btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}\n.st-btn:disabled,.st-btn[aria-disabled=\"true\"]{opacity:.5;cursor:not-allowed;pointer-events:none}\n\n/* ---- Icon button ---- */\n.st-icon-btn{display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid transparent;border-radius:var(--radius);cursor:pointer;color:var(--muted-foreground);background:transparent;transition:background var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out)}\n.st-icon-btn svg{width:1.25em;height:1.25em;display:block}\n.st-icon-btn--sm{width:32px;height:32px;font-size:15px}\n.st-icon-btn--md{width:40px;height:40px;font-size:17px}\n.st-icon-btn--lg{width:48px;height:48px;font-size:19px}\n.st-icon-btn--ghost:hover{background:var(--muted);color:var(--foreground)}\n.st-icon-btn--secondary{background:var(--secondary);color:var(--secondary-foreground)}\n.st-icon-btn--secondary:hover{background:color-mix(in srgb,var(--secondary) 82%,var(--foreground))}\n.st-icon-btn--primary{background:var(--primary);color:var(--primary-foreground)}\n.st-icon-btn--primary:hover{background:var(--primary-hover)}\n.st-icon-btn--active{background:var(--surface-raised,var(--secondary));color:var(--primary-text)}\n.st-icon-btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}\n.st-icon-btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}\n\n/* ============================================================\n   FORMS\n   ============================================================ */\n.st-field{display:flex;flex-direction:column;gap:6px;font-family:var(--font-sans)}\n.st-field__label{font-size:13px;font-weight:var(--fw-medium);color:var(--foreground)}\n.st-field__hint{font-size:13px;color:var(--muted-foreground-strong)}\n.st-field__error{font-size:13px;color:var(--destructive)}\n.st-input-wrap{position:relative;display:flex;align-items:center}\n.st-input-wrap__icon{position:absolute;left:12px;display:inline-flex;color:var(--muted-foreground);pointer-events:none}\n.st-input-wrap__icon svg{width:16px;height:16px;display:block}\n.st-input{width:100%;height:40px;padding:0 12px;background:#fff;border:1px solid var(--input);border-radius:var(--radius);color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:1;transition:border-color var(--dur-hover) var(--ease-out),box-shadow var(--dur-hover) var(--ease-out);box-sizing:border-box}\n.st-input::placeholder{color:var(--muted-foreground)}\n.st-input:hover{border-color:color-mix(in srgb,var(--input) 60%,var(--foreground))}\n.st-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}\n.st-input-wrap--icon .st-input{padding-left:36px}\n.st-input--error{border-color:var(--destructive)}\n.st-input--error:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--destructive) 30%,transparent)}\n.st-input:disabled{opacity:.55;cursor:not-allowed}\n.dark .st-input{background:color-mix(in srgb,var(--surface-raised) 55%,transparent)}\n/* select */\n.st-select-wrap{position:relative;display:flex;align-items:center}\n.st-select{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer}\n.st-select-wrap__chevron{position:absolute;right:12px;pointer-events:none;color:var(--muted-foreground);display:inline-flex}\n.st-select-wrap__chevron svg{width:16px;height:16px;display:block}\n\n/* ---- Segmented control ---- */\n.st-seg{display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-full)}\n.st-seg--square{border-radius:var(--radius)}\n.st-seg__item{appearance:none;border:none;background:transparent;font-family:var(--font-sans);font-weight:var(--fw-medium);color:var(--muted-foreground);cursor:pointer;border-radius:var(--radius-full);transition:background var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out);line-height:1;white-space:nowrap}\n.st-seg--square .st-seg__item{border-radius:calc(var(--radius) - 1px)}\n.st-seg--sm .st-seg__item{height:26px;padding:0 10px;font-size:12px}\n.st-seg--md .st-seg__item{height:32px;padding:0 14px;font-size:13px}\n.st-seg__item:hover{color:var(--foreground)}\n/* gold active (time-range) */\n.st-seg--gold .st-seg__item.is-active{background:var(--primary);color:var(--primary-foreground)}\n/* raised active (binary/context) */\n.st-seg--raised .st-seg__item.is-active{background:#fff;color:var(--foreground);box-shadow:var(--shadow-sm)}\n.dark .st-seg--raised .st-seg__item.is-active{background:var(--surface-raised);color:var(--foreground);box-shadow:none}\n.st-seg__item:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}\n\n/* ============================================================\n   SURFACES, Card + Stat card\n   ============================================================ */\n.st-card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius-card);padding:var(--pad-card);box-sizing:border-box}\n.st-card--feature{border-radius:var(--radius-lg)}\n.st-card--elevated{box-shadow:var(--shadow-md)}\n.st-card--hero{border-radius:var(--radius-xl);padding:var(--space-8)}\n.st-card--active{border-color:var(--primary)}\n.st-card--interactive{cursor:pointer;transition:transform var(--dur-hover) var(--ease-out),border-color var(--dur-hover) var(--ease-out),box-shadow var(--dur-hover) var(--ease-out)}\n.st-card--interactive:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--border) 40%,var(--foreground));box-shadow:var(--shadow-md)}\n\n.st-stat{display:flex;flex-direction:column;gap:12px;min-width:0}\n.st-stat__head{display:flex;align-items:center;justify-content:space-between;gap:8px}\n.st-stat__icon{display:inline-flex;color:var(--muted-foreground)}\n.st-stat__icon svg{width:16px;height:16px;display:block}\n.st-stat__row{display:flex;align-items:flex-end;gap:8px;line-height:1}\n.st-stat__value{font-family:var(--font-display);font-size:40px;font-weight:var(--fw-semibold);letter-spacing:-1px;color:var(--foreground);line-height:.95}\n.st-stat--highlight .st-stat__value{color:var(--primary-text)}\n.st-stat__delta{font-size:14px;font-weight:var(--fw-medium);padding-bottom:3px}\n.st-stat__delta--up{color:var(--success)}\n.st-stat__delta--down{color:var(--destructive)}\n.st-stat__delta--flat{color:var(--muted-foreground)}\n.st-stat__sublabel{font-size:14px;color:var(--muted-foreground);margin:0}\n\n/* ============================================================\n   DATA, Rating, MatchRow, RankedBar, SectionHeader\n   ============================================================ */\n.st-rating{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-sans)}\n.st-rating__dots{display:inline-flex;gap:3px}\n.st-rating__dot{width:8px;height:8px;border-radius:var(--radius-full);background:color-mix(in srgb,var(--foreground) 18%,transparent)}\n.st-rating__dot.is-filled{background:var(--foreground)}\n.st-rating--gold .st-rating__dot.is-filled{background:var(--primary)}\n.st-rating--sm .st-rating__dot{width:6px;height:6px}\n.st-rating__value{font-size:12px;font-weight:var(--fw-medium);color:var(--muted-foreground)}\n\n.st-match{display:flex;align-items:flex-start;gap:12px;padding:16px;font-family:var(--font-sans)}\n.st-match__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}\n.st-match__title{font-size:15px;font-weight:var(--fw-medium);color:var(--foreground)}\n.st-match__meta{font-size:14px;color:var(--muted-foreground);margin:0;overflow:hidden;text-overflow:ellipsis}\n.st-match__tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}\n.st-match__aside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}\n.st-match__source{font-size:12px;color:var(--muted-foreground)}\n\n.st-ranked{display:flex;align-items:center;gap:12px;font-family:var(--font-sans)}\n.st-ranked__rank{font-size:12px;font-weight:var(--fw-medium);color:var(--muted-foreground);width:18px;flex-shrink:0;text-align:right}\n.st-ranked__label{font-size:14px;color:var(--foreground);width:120px;flex-shrink:0;overflow:hidden;text-overf olor: var(--muted-foreground-strong);\n}\n\n/* ============================================================\n   Startt, Color tokens  (design.md §4, §14)\n   One gold accent on a calm, high-contrast canvas.\n   Two product themes: Midnight (dark, default) + Parchment (light).\n   ============================================================ */\n\n:root {\n  /* ---- Brand constants (never theme-swap) ---- */\n  --brand-gold: #FACC15;        /* master brand gold, exact logo vector (yellow-400) */\n  --ui-gold: #eab308;           /* current in-product gold (yellow-500), converging to brand */\n  --gold-hover: #facc15;\n  --gold-active: #854d0e;\n  --gold-text-dark: #ca8a04;    /* gold AS TEXT on dark surfaces */\n  --gold-text-light: #854d0e;   /* gold AS TEXT on light surfaces */\n  --foreground-on-gold: #262624;/* text/icons on a gold fill, always ink, never white */\n\n  --ink: #262624;               /* warm near-black */\n  --parchment: #ede9dd;         /* product light canvas */\n  --midnight: #09090b;          /* product dark canvas */\n  --brand-dark: #020617;        /* slate-950, the logo's own dark; canonical brand near-black */\n  --deck-dark: #101010;\n  --deck-light: #f7f7f7;\n\n  /* ---- Semantic status (shared) ---- */\n  --destructive: #ef4444;\n  --warning: #f59e0b;\n  --warning-active: #92400e;\n  --success: #22c55e;\n  --live: #22c55e;\n  --info: #60a5fa;\n\n  /* ---- Categorical data-viz series (design.md §4.6) ---- */\n  --chart-1: #3b82f6;  /* blue , Dealflow */\n  --chart-2: #22c55e;  /* green */\n  --chart-3: #a855f7;  /* purple */\n  --chart-4: #f97316;  /* orange */\n  --chart-5: #06b6d4;  /* cyan */\n  --dim-dealflow: #3b82f6;\n  --dim-radar: #6d28d9;\n\n  /* ---- Tag / badge palette, light values (design.md §4.5) ---- */\n  --tag-blue: #1d4ed8;\n  --tag-cyan: #0e7490;\n  --tag-emerald: #047857;\n  --tag-rose: #be123c;\n  --tag-violet: #6d28d9;\n  /* dark-surface lifts */\n  --tag-blue-dark: #60a5fa;\n  --tag-cyan-dark: #22d3ee;\n  --tag-emerald-dark: #34d399;\n  --tag-rose-dark: #fb7185;\n  --tag-violet-dark: #a78bfa;\n}\n\n/* ===========================================================\n   LIGHT, \"Parchment\" (product)\n   =========================================================== */\n:root,\n.light {\n  --background: #ede9dd;\n  --foreground: #262624;\n  --card: #ede9dd;\n  --card-foreground: #262624;\n  --popover: #ffffff;\n  --popover-foreground: #262624;\n\n  --primary: #eab308;\n  --primary-foreground: #262624;\n  --primary-hover: #facc15;\n  --primary-active: #854d0e;\n  --primary-text: #854d0e;        /* gold-as-text on light */\n\n  --secondary: #e4dfd1;\n  --secondary-foreground: #262624;\n  --accent: #e4dfd1;\n\n  --muted: #2626240f;             /* ~6% ink wash */\n  --muted-foreground: #87867f;    /* large / secondary text only (§13) */\n  --muted-foreground-strong: #6a695f; /* small muted text on parchment (AA) */\n\n  --border: #2626241f;            /* ~12% ink */\n  --input: #26262438;             /* ~22% ink */\n  --ring: #eab30873;              /* gold @ ~45% */\n\n  --nav-surface: #ede9dd;\n  --table-header: #ede9dd;\n\n  --shadow-sm: 0 1px 3px rgba(0,0,0,.1);\n  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1);\n  --shadow-elevated: 0 25px 50px -12px rgba(38,38,36,.18);\n\n  color-scheme: light;\n}\n\n/* ===========================================================\n   DARK, \"Midnight\" (product default)\n   =========================================================== */\n.dark {\n  --background: #09090b;\n  --foreground: #f4f4f5;\n  --card: #18181b;\n  --card-foreground: #f4f4f5;\n  --popover: #18181b;\n  --popover-foreground: #f4f4f5;\n  --surface-raised: #27272a;\n\n  --primary: #eab308;\n  --primary-foreground: #262624;\n  --primary-hover: #facc15;\n  --primary-active: #854d0e;\n  --primary-text: #ca8a04;        /* gold-as-text on dark */\n\n  --secondary: #27272a;\n  --secondary-foreground: #f4f4f5;\n  --accent: #27272a;\n\n  --muted: #ffffff0f;\n  --muted-foreground: #a1a1aa;    /* passes AA on midnight */\n  --muted-foreground-strong: #a1a1aa;\n\n  --border: #27272a;\n  --input: #3f3f46;\n  --ring: #eab30873;\n\n  --nav-surface: #18181b;\n  --table-header: #18181b;\n\n  --shadow-sm: 0 1px 3px rgba(0,0,0,.4);\n  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.5);\n  --shadow-elevated: 0 25px 50px -12px rgba(0,0,0,.6);\n\n  color-scheme: dark;\n}\n\n/* ============================================================\n   Startt, Spacing, radius & elevation tokens  (design.md §6)\n   4px base grid. Multiples of 4 only.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4px base): 4 8 12 16 20 24 32 40 48 64 ---- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n\n  /* component padding 12–16; section padding 48–64+ */\n  --pad-control: 12px;\n  --pad-card: 20px;\n  --pad-section: 48px;\n\n  /* ---- Radius ---- */\n  --radius: 0.25rem;      /* 4px, buttons, inputs, tags */\n  --radius-md: 8px;       /* popovers */\n  --radius-card: 12px;    /* cards */\n  --radius-lg: 16px;      /* feature cards */\n  --radius-xl: 24px;      /* hero / marketing containers */\n  --radius-full: 9999px;  /* pills, avatars, badge coin, Live chip */\n\n  /* ---- Elevation ---- */\n  --shadow-sm: 0 1px 3px rgba(0,0,0,.1);\n  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1);\n  --shadow-elevated: 0 25px 50px -12px rgba(38,38,36,.18);\n\n  /* ---- Motion (design.md §10) ---- */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);  /* @kind other */\n  --dur-enter: 200ms;   /* @kind other */\n  --dur-hover: 120ms;   /* @kind other */\n\n  /* ---- Layout ---- */\n  --rail-width: 64px;         /* @kind spacing */\n  --container-max: 1200px;    /* @kind spacing */\n}\n\n/* ============================================================\n   Startt, Component styles\n   Class-based, token-referencing. Ships to consumers via styles.css.\n   Prefix: st-  ·  Themes via .dark / .light ancestor.\n   ============================================================ */\n\n/* ---- Signature overline / micro-label ---- */\n.st-overline{font-family:var(--font-sans);font-size:var(--text-micro);font-weight:var(--fw-semibold);line-height:var(--lh-tight);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--muted-foreground-strong);margin:0}\n\n/* ============================================================\n   BUTTONS\n   ============================================================ */\n.st-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-sans);font-weight:var(--fw-semibold);border:1px solid transparent;border-radius:var(--radius);cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1;transition:background var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out),border-color var(--dur-hover) var(--ease-out),transform var(--dur-hover) var(--ease-out);-webkit-user-select:none;user-select:none}\n.st-btn__label{display:inline-block}\n.st-btn__icon{display:inline-flex;align-items:center;justify-content:center}\n.st-btn__icon svg{width:1.15em;height:1.15em;display:block}\n/* sizes */\n.st-btn--sm{height:32px;padding:0 12px;font-size:13px}\n.st-btn--md{height:40px;padding:0 16px;font-size:14px}\n.st-btn--lg{height:48px;padding:0 22px;font-size:15px}\n.st-btn--block{width:100%}\n/* primary, the one gold moment */\n.st-btn--primary{background:var(--primary);color:var(--primary-foreground)}\n.st-btn--primary:hover{background:var(--primary-hover)}\n.st-btn--primary:active{background:var(--primary-active);color:#fff}\n/* secondary, neutral */\n.st-btn--secondary{background:var(--secondary);color:var(--secondary-foreground)}\n.st-btn--secondary:hover{background:color-mix(in srgb,var(--secondary) 82%,var(--foreground))}\n/* soft / tonal gold */\n.st-btn--soft{background:color-mix(in srgb,var(--primary) 20%,transparent);color:var(--primary-text)}\n.st-btn--soft:hover{background:color-mix(in srgb,var(--primary) 30%,transparent)}\n/* ghost */\n.st-btn--ghost{background:transparent;color:var(--muted-foreground)}\n.st-btn--ghost:hover{background:var(--muted);color:var(--foreground)}\n/* focus + disabled */\n.st-btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}\n.st-btn:disabled,.st-btn[aria-disabled=\"true\"]{opacity:.5;cursor:not-allowed;pointer-events:none}\n\n/* ---- Icon button ---- */\n.st-icon-btn{display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid transparent;border-radius:var(--radius);cursor:pointer;color:var(--muted-foreground);background:transparent;transition:background var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out)}\n.st-icon-btn svg{width:1.25em;height:1.25em;display:block}\n.st-icon-btn--sm{width:32px;height:32px;font-size:15px}\n.st-icon-btn--md{width:40px;height:40px;font-size:17px}\n.st-icon-btn--lg{width:48px;height:48px;font-size:19px}\n.st-icon-btn--ghost:hover{background:var(--muted);color:var(--foreground)}\n.st-icon-btn--secondary{background:var(--secondary);color:var(--secondary-foreground)}\n.st-icon-btn--secondary:hover{background:color-mix(in srgb,var(--secondary) 82%,var(--foreground))}\n.st-icon-btn--primary{background:var(--primary);color:var(--primary-foreground)}\n.st-icon-btn--primary:hover{background:var(--primary-hover)}\n.st-icon-btn--active{background:var(--surface-raised,var(--secondary));color:var(--primary-text)}\n.st-icon-btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}\n.st-icon-btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}\n\n/* ============================================================\n   FORMS\n   ============================================================ */\n.st-field{display:flex;flex-direction:column;gap:6px;font-family:var(--font-sans)}\n.st-field__label{font-size:13px;font-weight:var(--fw-medium);color:var(--foreground)}\n.st-field__hint{font-size:13px;color:var(--muted-foreground-strong)}\n.st-field__error{font-size:13px;color:var(--destructive)}\n.st-input-wrap{position:relative;display:flex;align-items:center}\n.st-input-wrap__icon{position:absolute;left:12px;display:inline-flex;color:var(--muted-foreground);pointer-events:none}\n.st-input-wrap__icon svg{width:16px;height:16px;display:block}\n.st-input{width:100%;height:40px;padding:0 12px;background:#fff;border:1px solid var(--input);border-radius:var(--radius);color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:1;transition:border-color var(--dur-hover) var(--ease-out),box-shadow var(--dur-hover) var(--ease-out);box-sizing:border-box}\n.st-input::placeholder{color:var(--muted-foreground)}\n.st-input:hover{border-color:color-mix(in srgb,var(--input) 60%,var(--foreground))}\n.st-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}\n.st-input-wrap--icon .st-input{padding-left:36px}\n.st-input--error{border-color:var(--destructive)}\n.st-input--error:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--destructive) 30%,transparent)}\n.st-input:disabled{opacity:.55;cursor:not-allowed}\n.dark .st-input{background:color-mix(in srgb,var(--surface-raised) 55%,transparent)}\n/* select */\n.st-select-wrap{position:relative;display:flex;align-items:center}\n.st-select{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer}\n.st-select-wrap__chevron{position:absolute;right:12px;pointer-events:none;color:var(--muted-foreground);display:inline-flex}\n.st-select-wrap__chevron svg{width:16px;height:16px;display:block}\n\n/* ---- Segmented control ---- */\n.st-seg{display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-full)}\n.st-seg--square{border-radius:var(--radius)}\n.st-seg__item{appearance:none;border:none;background:transparent;font-family:var(--font-sans);font-weight:var(--fw-medium);color:var(--muted-foreground);cursor:pointer;border-radius:var(--radius-full);transition:background var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out);line-height:1;white-space:nowrap}\n.st-seg--square .st-seg__item{border-radius:calc(var(--radius) - 1px)}\n.st-seg--sm .st-seg__item{height:26px;padding:0 10px;font-size:12px}\n.st-seg--md .st-seg__item{height:32px;padding:0 14px;font-size:13px}\n.st-seg__item:hover{color:var(--foreground)}\n/* gold active (time-range) */\n.st-seg--gold .st-seg__item.is-active{background:var(--primary);color:var(--primary-foreground)}\n/* raised active (binary/context) */\n.st-seg--raised .st-seg__item.is-active{background:#fff;color:var(--foreground);box-shadow:var(--shadow-sm)}\n.dark .st-seg--raised .st-seg__item.is-active{background:var(--surface-raised);color:var(--foreground);box-shadow:none}\n.st-seg__item:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}\n\n/* ============================================================\n   SURFACES, Card + Stat card\n   ============================================================ */\n.st-card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius-card);padding:var(--pad-card);box-sizing:border-box}\n.st-card--feature{border-radius:var(--radius-lg)}\n.st-card--elevated{box-shadow:var(--shadow-md)}\n.st-card--hero{border-radius:var(--radius-xl);padding:var(--space-8)}\n.st-card--active{border-color:var(--primary)}\n.st-card--interactive{cursor:pointer;transition:transform var(--dur-hover) var(--ease-out),border-color var(--dur-hover) var(--ease-out),box-shadow var(--dur-hover) var(--ease-out)}\n.st-card--interactive:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--border) 40%,var(--foreground));box-shadow:var(--shadow-md)}\n\n.st-stat{display:flex;flex-direction:column;gap:12px;min-width:0}\n.st-stat__head{display:flex;align-items:center;justify-content:space-b e:14px;color:#d4d4d8;\">3 months<\u002Fspan><span style=\"font-family:Newsreader,'Instrument Serif',Georgia,serif;font-size:17px;font-weight:600;color:#f4f4f5;font-variant-numeric:tabular-nums;\">₹15,999 <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;color:#a1a1aa;font-weight:400;font-size:11px;\">(₹5,333/mo)<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;border-top:1px solid #27272a;\"><span style=\"font-size:14px;color:#d4d4d8;\">12 months<\u002Fspan><span style=\"font-family:Newsreader,'Instrument Serif',Georgia,serif;font-size:17px;font-weight:600;color:#f4f4f5;font-variant-numeric:tabular-nums;\">₹59,999 <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;color:#a1a1aa;font-weight:400;font-size:11px;\">(₹5,000/mo)<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:1px solid #27272a;margin-top:22px;padding-top:20px;display:flex;flex-direction:column;gap:10px;\">\n<div style=\"font-size:14px;color:#a1a1aa;line-height:1.55;\">Thesis-fit matching, Founder Radar and Live Dealflow<\u002Fdiv>\n<div style=\"font-size:14px;color:#a1a1aa;line-height:1.55;\">Investor-ready profiles, watchlist and daily alerts<\u002Fdiv>\n<div style=\"font-size:14px;color:#a1a1aa;line-height:1.55;\">No API access on this plan<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:13px;color:#a1a1aa;margin:24px 0 0;line-height:1.6;\">Prices exclude GST at 18%, and are indicative above five seats. Tell us how many logins you need and we will confirm and set them up together.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"st-sec\" style=\"padding:96px 0 0;border-top:1px solid #27272a;\">\n<div style=\"display:flex;align-items:baseline;gap:14px;\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;font-weight:500;letter-spacing:0.12em;font-size:11px;text-transform:uppercase;color:#ca8a04;\">Next<\u002Fspan><\u002Fdiv>\n<h2 class=\"st-h2\" style=\"font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-weight:400;font-size:58px;letter-spacing:-1px;line-height:1.06;margin:22px 0 0;max-width:20ch;color:#f4f4f5;\">Let’s do a <span style=\"color:#facc15;\">live walkthrough<\u002Fspan>.<\u002Fh2>\n<p style=\"font-size:17px;line-height:1.65;color:#a1a1aa;max-width:62ch;margin:24px 0 0;\">Twenty minutes on a call is the fastest way to see this properly. We will run it on your thesis, live, and go through the sources and what each one catches, the filtering and how thesis fit is scored, and the enrichment that lands on a profile.<\u002Fp>\n<div class=\"st-cta\" style=\"display:flex;align-items:center;gap:12px;margin-top:34px;flex-wrap:wrap;\">\n<a href=\"https://calendly.com/contact-startt/30min\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;background:#facc15;color:#262624;border-radius:8px;padding:16px 30px;font-size:15px;font-weight:600;letter-spacing:-0.1px;text-decoration:none;text-align:center;\" style-hover=\"background:#facc15;color:#262624;\">Let’s talk &nbsp;→<\u002Fa>\n<a href=\"https://startt.ai/login\" style=\"display:inline-block;border:1px solid #3f3f46;border-radius:8px;padding:15px 28px;font-size:15px;font-weight:500;color:#f4f4f5;text-decoration:none;text-align:center;\" style-hover=\"border-color:#54451a;color:#facc15;\">Login to Startt<\u002Fa>\n<\u002Fdiv>\n<div style=\"margin-top:40px;padding-top:28px;border-top:1px solid #27272a;font-size:14.5px;line-height:1.75;color:#a1a1aa;\"><span style=\"color:#f4f4f5;font-weight:600;\">Shauryaveer Saxena<\u002Fspan><br>Founder, Startt · +91 99996 00812 · <a href=\"mailto:founder@startt.in\" style=\"color:#ca8a04;\">founder@startt.in<\u002Fa><\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"padding:44px 0 96px;margin-top:64px;border-top:1px solid #27272a;\">\n<p style=\"font-size:12px;line-height:1.75;color:#a1a1aa;max-width:96ch;margin:0;\">Figures from Startt’s live index, August 2026: roughly 30,000 profiles monitored across eleven sources, 90% filtered out by the classification layer, roughly 3,000 qualified founders enriched, roughly 1,000 surfaced to investors monthly. Founder examples are live pre-seed and earlier entries. API and MCP access are included on the team plan.<\u002Fp>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showRail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Chrome&quot;},&quot;maxSeats&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:5,&quot;max&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Pricing&quot;}}\">\nconst STEPS = [\n  { body: \"Continuous ingestion from all eleven sources, via APIs and custom crawlers.\", meta: \"Nothing waits for a weekly batch. The fastest sources refresh hourly, and roughly 30,000 profiles sit in the window at any time.\" },\n  { body: \"Agent Orion runs deterministic rules first, then an LLM judging venture potential and founder intent.\", meta: \"This is where 90% of the intake is removed: entities older than five years, services and trading-only models, solo consultants, dormant or struck-off companies, and side projects.\" },\n  { body: \"People and entity data joined from Brightdata, Crunchbase, MCA, company sites and Perplexity.\", meta: \"Verified, not scraped. Adds education, work history, past ventures, MCA registration and compliance, product positioning, and market context.\" },\n  { body: \"The same founder appearing across five sources is vector-matched into one profile. No duplicates.\", meta: \"Taxonomy, archetype and a confidence score are applied, producing one investor-ready profile with a signal-strength score against your thesis.\" }\n];\n\nconst ANSWERS = {\n  today: { label: \"4 results, today\", rows: [\n    { name: \"Egreen Quanta\", meta: \"Quantum Computing, Bihar · Patent · PhD founder · Grant\" },\n    { name: \"SchoolBus2.0\", meta: \"EdTech, Nashik · Live Dealflow · Women founder · ₹50L traction\" },\n    { name: \"EarthSaathi\", meta: \"Waste-to-energy, Lucknow · Energy frontier · PhD founder\" },\n    { name: \"Arasilk\", meta: \"Biomaterials, Bhubaneswar · Patent · IISER Pune · Grant-backed\" }\n  ]},\n  climate: { label: \"2 results, climate with patent or grant, this month\", rows: [\n    { name: \"EarthSaathi\", meta: \"Waste-to-energy, Lucknow · Energy frontier · PhD founder\" },\n    { name: \"Arasilk\", meta: \"Biomaterials, Bhubaneswar · Patent · IISER Pune · Grant-backed\" }\n  ]},\n  women: { label: \"1 result, women founders with early traction\", rows: [\n    { name: \"SchoolBus2.0\", meta: \"EdTech, Nashik · Live Dealflow · Women founder · ₹50L traction\" }\n  ]},\n  deeptech: { label: \"2 results, deeptech out of research institutions\", rows: [\n    { name: \"Egreen Quanta\", meta: \"Quantum Computing, Bihar · Patent · PhD founder · Grant\" },\n    { name: \"Arasilk\", meta: \"Biomaterials, Bhubaneswar · Patent · IISER Pune · Grant-backed\" }\n  ]}\n};\n\nconst PROMPTS = {\n  p0: [\"Show me thesis-fit founders from today\", \"today\"],\n  p1: [\"Climate founders with patents or grants this month\", \"climate\"],\n  p2: [\"Women founders with early traction\", \"women\"],\n  p3: [\"Deeptech founders out of research institutions\", \"deeptech\"]\n};\n\nfunction routeQuery(q) {\n  const s = (q || \"\").toLowerCase();\n  if (/climate|energy|cleantech|waste|solar|carbon|green/.test(s)) return \"climate\";\n  if (/women|woman|female/.test(s)) return \"women\";\n  if (/deeptech|deep tech|patent|research|phd|iit|iiser|institution|ip\\b/.test(s)) return \"deeptech\";\n  return \"today\";\n}\n\nconst SECTIONS = [\"signals\", \"combine\", \"access\", \"pricing\"];\n\nclass Component extends DCLogic {\n  state = { open: null, step: 1, active: 0, seats: 5, funnel: 1, q: PROMPTS.p0[0], key: \"today\" };\n\n  componentDidMount() {\n    // IntersectionObserver works regardless of which ancestor actually scrolls.\n    if (typeof IntersectionObserver === \"undefined\") return;\n\n    const f = document.getElementById(\"funnel\");\n    const vh = window.innerHeight || 800;\n    if (f && f.getBoundingClientRect().top > vh * 0.9) {\n      this.setState({ funnel: 0 });\n      this._io = new IntersectionObserver((e) => {\n        if (e.some((x) => x.isIntersecting)) { this._io.disconnect(); this.runFunnel(); }\n      }, { threshold: 0.2 });\n      this._io.observe(f);\n      // If nothing scrolls in this document the observer never fires; never leave the numbers at zero.\n      this._fallback = setTimeout(() => { if (this._io) this._io.disconnect(); this.runFunnel(); }, 1400);\n    }\n\n    this._seen = new Set();\n    this._nav = new IntersectionObserver((entries) => {\n      entries.forEach((en) => {\n        const i = SECTIONS.indexOf(en.target.id);\n        if (i < 0) return;\n        if (en.isIntersecting) this._seen.add(i); else this._seen.delete(i);\n      });\n      if (this._seen.size) {\n        const active = Math.min.apply(null, Array.from(this._seen));\n        if (active !== this.state.active) this.setState({ active });\n      }\n    }, { threshold: 0.01, rootMargin: \"-15% 0px -60% 0px\" });\n    SECTIONS.forEach((id) => { const el = document.getElementById(id); if (el) this._nav.observe(el); });\n  }\n\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._nav) this._nav.disconnect();\n    if (this._fallback) clearTimeout(this._fallback);\n    if (this._land) clearTimeout(this._land);\n    if (this._tween) clearInterval(this._tween);\n  }\n\n  runFunnel() {\n    if (this._ran) return;\n    this._ran = true;\n    const start = Date.now(), dur = 1100;\n    // setInterval, not rAF: rAF never ticks when the document is backgrounded.\n    this._tween = setInterval(() => {\n      const p = Math.min(1, (Date.now() - start) / dur);\n      this.setState({ funnel: 1 - Math.pow(1 - p, 3) });\n      if (p >= 1) { clearInterval(this._tween); this._tween = null; }\n    }, 16);\n    // last-resort guarantee that the real numbers land\n    this._land = setTimeout(() => {\n      if (this._tween) { clearInterval(this._tween); this._tween = null; }\n      this.setState({ funnel: 1 });\n    }, dur + 400);\n  }\n\n  seatPrice(n) {\n    if (n <= 1) return 5999;\n    if (n < 5) return n * 5499;\n    if (n === 5) return 24999;\n    return 24999 + (n - 5) * 4999;\n  }\n\n  renderVals() {\n    const inr = (n) => \"₹\" + n.toLocaleString(\"en-IN\");\n    const st = this.state;\n    const maxSeats = this.props.maxSeats ?? 20;\n    const vals = {\n      showRail: this.props.showRail ?? true,\n      maxSeats,\n      seats: Math.min(st.seats, maxSeats),\n      q: st.q,\n      results: ANSWERS[st.key].rows,\n      resultLabel: ANSWERS[st.key].label,\n      stepBody: STEPS[st.step].body,\n      stepMeta: STEPS[st.step].meta,\n      f1: Math.round(30000 * st.funnel).toLocaleString(\"en-IN\"),\n      f2: Math.round(3000 * st.funnel).toLocaleString(\"en-IN\"),\n      f3: Math.round(1000 * st.funnel).toLocaleString(\"en-IN\"),\n      b1: (100 * st.funnel).toFixed(1) + \"%\",\n      b2: (10 * st.funnel).toFixed(2) + \"%\",\n      b3: (3.33 * st.funnel).toFixed(2) + \"%\",\n      onSeats: (e) => this.setState({ seats: Number(e.target.value) }),\n      onQ: (e) => this.setState({ q: e.target.value }),\n      onQKey: (e) => { if (e.key === \"Enter\") this.setState({ key: routeQuery(this.state.q) }); },\n      runQ: () => this.setState({ key: routeQuery(this.state.q) })\n    };\n\n    for (let i = 0; i < 12; i++) {\n      vals[\"t\" + i] = () => this.setState((s) => ({ open: s.open === i ? null : i }));\n      vals[\"o\" + i] = st.open === i;\n      vals[\"caret\" + i] = st.open === i ? \"rotate(180deg)\" : \"rotate(0deg)\";\n    }\n\n    for (let i = 0; i < 4; i++) {\n      const on = st.step === i;\n      vals[\"s\" + i] = () => this.setState({ step: i });\n      vals[\"stepBorder\" + i] = on ? \"#facc15\" : \"#27272a\";\n      vals[\"stepNum\" + i] = on ? \"#facc15\" : \"#52525b\";\n      vals[\"stepTitle\" + i] = on ? \"#f4f4f5\" : \"#a1a1aa\";\n      vals[\"dotText\" + i] = st.active === i ? \"#facc15\" : \"#52525b\";\n    }\n\n    Object.keys(PROMPTS).forEach((k) => {\n      vals[k] = () => this.setState({ q: PROMPTS[k][0], key: PROMPTS[k][1] });\n    });\n\n    const n = Math.min(st.seats, maxSeats);\n    const total = this.seatPrice(n);\n    vals.priceLabel = inr(total);\n    vals.priceSub = \"per month\" + (n > 1 ? \", \" + inr(Math.round(total / n)) + \" per seat\" : \"\");\n    vals.seatLabel = n === 1 ? \"1 login\" : n + \" logins\";\n    vals.seatNote = n === 1\n      ? \"Single seat, no API access on this plan.\"\n      : n < 5\n        ? \"Below five, seats are priced individually. Five is where the team rate starts.\"\n        : n === 5\n          ? \"The recommended size. API and MCP access included.\"\n          : \"Five logins at \" + inr(24999) + \", then \" + inr(4999) + \" for each additional seat.\";\n\n    return vals;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
