  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Startt Lookback, August 2026');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Startt Lookback, August 2026');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

funding event, in the order it was announced. Hover any of them. Prior funding was researched per company rather than read off a stage label, which is the difference between a first-cheque list and a stage-label list.<\u002Fdiv>\n\n      <div style=\"background:linear-gradient(180deg,rgba(31,31,35,.72),rgba(19,19,22,.4)); border:1px solid #27272a; border-radius:4px; padding:clamp(18px,2.4vw,26px) clamp(14px,2vw,22px); margin:32px 0 0\">\n        <div style=\"display:flex; flex-direction:column; gap:22px\">\n          <div>\n            <div style=\"display:flex; align-items:baseline; gap:12px; padding:0 0 9px; flex-wrap:wrap\">\n              <span style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:26px; line-height:1; color:#f4f4f5\">95<\u002Fspan>\n              <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.16em; color:#a1a1aa\">ROUNDS RAISED IN INDIA ACROSS THE WHOLE OF AUGUST<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(95,minmax(0,1fr)); gap:clamp(1px,.2vw,2px)\">\n              <sc-for list=\"{{ allDots }}\" as=\"ad\" hint-placeholder-count=\"95\">\n                <button type=\"button\" sc-camel-on-mouse-enter=\"{{ ad.on }}\" sc-camel-on-focus=\"{{ ad.on }}\" sc-camel-on-click=\"{{ ad.on }}\" aria-label=\"{{ ad.aria }}\" style=\"appearance:none; border:0; margin:0; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer; display:block; width:100%; height:30px; border-radius:1px; background:{{ ad.bg }}; box-shadow:{{ ad.ring }}\"><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex; align-items:baseline; gap:12px; padding:0 0 9px; flex-wrap:wrap\">\n              <span style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:26px; line-height:1; color:#eab308\">37<\u002Fspan>\n              <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.16em; color:#a1a1aa\">WERE A FIRST INSTITUTIONAL CHEQUE &nbsp;·&nbsp; 58 WERE FOLLOW-ON OR LATER<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(95,minmax(0,1fr)); gap:clamp(1px,.2vw,2px)\">\n              <sc-for list=\"{{ firstDots }}\" as=\"fd\" hint-placeholder-count=\"37\">\n                <button type=\"button\" sc-camel-on-mouse-enter=\"{{ fd.on }}\" sc-camel-on-focus=\"{{ fd.on }}\" sc-camel-on-click=\"{{ fd.on }}\" aria-label=\"{{ fd.aria }}\" style=\"appearance:none; border:0; margin:0; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer; display:block; width:100%; height:30px; border-radius:1px; background:{{ fd.bg }}; box-shadow:{{ fd.ring }}\"><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:18px clamp(20px,3vw,36px); margin-top:24px; padding-top:20px; border-top:1px solid #27272a\">\n          <div style=\"min-height:88px\">\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.16em; color:#eab308\">{{ hov.tag }}<\u002Fdiv>\n            <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:26px; line-height:1.14; letter-spacing:-.015em; margin-top:9px; color:#f4f4f5\">{{ hov.company }}<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; color:#a1a1aa; margin-top:8px\">{{ hov.line }}<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:#a1a1aa; margin-top:7px; line-height:1.6\">{{ hov.lead }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.16em; color:#a1a1aa\">WHERE THE CAPITAL WENT<\u002Fdiv>\n            <div style=\"display:flex; gap:2px; height:10px; margin:14px 0 12px\">\n              <div style=\"width:{{ capW }}; background:#eab308; border-radius:4px; min-width:3px\"><\u002Fdiv>\n              <div style=\"flex:1; background:#27272a; border-radius:4px\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:1fr auto; gap:8px 14px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#a1a1aa\">\n              <div>INTO FIRST ROUNDS<\u002Fdiv><div style=\"color:#eab308; font-variant-numeric:tabular-nums\">$37.39M · 3.7%<\u002Fdiv>\n              <div>INTO EVERYTHING ELSE<\u002Fdiv><div style=\"color:#f4f4f5; font-variant-numeric:tabular-nums\">$963.6M · 96.3%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px; color:#a1a1aa; margin-top:14px; line-height:1.6\">Eleven of the ninety-five disclosed no amount, so every capital figure here is a floor, not an estimate.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fsection>\n\n    <section id=\"p2\" style=\"padding:clamp(74px,10vw,118px) 0 0\">\n      <div style=\"height:1px; background:#27272a\"><\u002Fdiv>\n      <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:clamp(26px,3.8vw,44px); line-height:1.12; letter-spacing:-.015em; color:#f4f4f5; padding:26px 0 0; text-wrap:pretty\">Two in five of the month's decisions. <span style=\"color:#eab308\">One in twenty-seven<\u002Fspan> of its dollars.<\u002Fdiv>\n      <div style=\"font-size:14.5px; line-height:1.72; color:#a1a1aa; padding:14px 0 0; max-width:80ch; text-wrap:pretty\">A first institutional round means no prior external priced cheque of any kind, including angel syndicates and government grants.<\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px; background:#27272a; border:1px solid #27272a; border-radius:4px; overflow:hidden; margin:30px 0 0\">\n        <sc-for list=\"{{ cohortStats }}\" as=\"cs\" hint-placeholder-count=\"4\">\n          <div style=\"background:#101014; padding:22px 20px 20px\">\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.16em; color:#a1a1aa\">{{ cs.k }}<\u002Fdiv>\n            <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:clamp(34px,3.6vw,44px); line-height:1.02; margin-top:12px; letter-spacing:-.025em; color:{{ cs.c }}; text-shadow:{{ cs.glow }}\">{{ cs.v }}<\u002Fdiv>\n            <div style=\"font-size:12.5px; line-height:1.55; margin-top:9px; color:#a1a1aa\">{{ cs.n }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"font-size:15px; line-height:1.74; color:#a1a1aa; padding:26px 0 0; max-width:74ch; text-wrap:pretty\">Several rounds in the month read as a first raise and were not. Runable's earlier seed appears only on a fund's portfolio page. Curaa's prior backers are named in the press as \"existing investors\" and nowhere else. Ringg AI's August round is a Series A extension.<\u002Fdiv>\n\n      <div style=\"margin-top:26px\">\n        <dc-import name=\"LookbackChartDark\" title=\"First cheques by size\" note=\"Nine of the thirty-seven disclosed no amount and are shown as their own band rather than dropped.\" rows=\"{{ chequeRows }}\" foot=\"Median $865K on the 28 disclosed. The single $9.0M round is nearly three times the next largest, which was $3.2M.\" hint-size=\"100%,290px\"><\u002Fdc-import>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"p3\" style=\"padding:clamp(74px,10vw,118px) 0 0\">\n      <div style=\"height:1px; background:#27272a\"><\u002Fdiv>\n      <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:clamp(26px,3.8vw,44px); line-height:1.12; letter-spacing:-.015em; color:#f4f4f5; padding:26px 0 0; text-wrap:pretty\">What kind of company gets a first cheque<\u002Fdiv>\n      <div style=\"font-size:14.5px; line-height:1.72; color:#a1a1aa; padding:14px 0 0; max-width:80ch; text-wrap:pretty\"><span style=\"color:#f4f4f5\">Age is the sharpest cut in the whole report.<\u002Fspan> Median age at funding is 16.8 months. Eleven of thirty-six companies raised inside their first year, and seven of those inside six months. Three were more than five years old, which is what a first cheque looks like when a founder has been running the business on revenue.<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:20px; margin-top:30px; align-items:stretch\">\n        <dc-import name=\"LookbackChartDark\" title=\"First rounds by sector\" note=\"Rolled up from the locked ISS taxonomy, which splits these 37 across 15 industries and 27 sectors.\" rows=\"{{ sectorRows }}\" foot=\"Defence, space and robotics is seven of thirty-seven, and every one is a hardware or systems company rather than a software wrapper.\" hint-size=\"100%,320px\"><\u002Fdc-import>\n        <dc-import name=\"LookbackChartDark\" title=\"Age at first cheque\" note=\"Months from incorporation on the MCA register to 15 August 2026.\" rows=\"{{ ageRows }}\" foot=\"Median 16.8 months across the 36 companies with an entity on the register.\" hint-size=\"100%,320px\"><\u002Fdc-import>\n        <dc-import name=\"LookbackChartDark\" title=\"Founding team size\" note=\"Named founders only, verified against the company's own site where the press disagreed.\" rows=\"{{ teamRows }}\" foot=\"Two-founder teams are half the cohort. Eight companies raised a first round on a solo founder.\" hint-size=\"100%,290px\"><\u002Fdc-import>\n        <dc-import name=\"LookbackChartDark\" title=\"Where they are registered\" note=\"ROC city from the register, or headquarters where no Indian entity exists.\" rows=\"{{ cityRows }}\" foot=\"Bengaluru is twelve of thirty-seven. Three companies are US-registered with Indian founders and stay in, flagged.\" hint-size=\"100%,290px\"><\u002Fdc-import>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"p4\" style=\"padding:clamp(74px,10vw,118px) 0 0\">\n      <div style=\"height:1px; background:#27272a\"><\u002Fdiv>\n      <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:clamp(26px,3.8vw,44px); line-height:1.12; letter-spacing:-.015em; color:#f4f4f5; padding:26px 0 0; text-wrap:pretty\">What kind of founder gets a first cheque<\u002Fdiv>\n      <div style=\"font-size:14.5px; line-height:1.72; color:#a1a1aa; padding:14px 0 0; max-width:80ch; text-wrap:pretty\">Seventy-eight named founders across the thirty-seven companies. Every one carries a profile.<\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px; background:#27272a; border:1px solid #27272a; border-radius:4px; overflow:hidden; margin:30px 0 0\">\n        <sc-for list=\"{{ founderStats }}\" as=\"fs\" hint-placeholder-count=\"4\">\n          <div style=\"background:#101014; padding:22px 20px 20px\">\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.16em; color:#a1a1aa\">{{ fs.k }}<\u002Fdiv>\n            <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:clamp(34px,3.6vw,44px); line-height:1.02; margin-top:12px; letter-spacing:-.025em; color:{{ fs.c }}; text-shadow:{{ fs.glow }}\">{{ fs.v }}<\u002Fdiv>\n            <div style=\"font-size:12.5px; line-height:1.55; margin-top:9px; color:#a1a1aa\">{{ fs.n }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"font-size:15px; line-height:1.74; color:#a1a1aa; padding:26px 0 0; max-width:74ch; text-wrap:pretty\"><span style=\"color:#f4f4f5\">The first-cheque founder is not young.<\u002Fspan> Median career length is twelve years, and only ten of the seventy-six founders with a career history on file are less than five years into working life. It is mostly people in their second decade of work, going out on their own for the first or second time.<\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:20px; margin-top:26px; align-items:stretch\">\n        <dc-import name=\"LookbackChartDark\" title=\"Career length at first cheque\" note=\"Years from the founder's earliest recorded professional role.\" rows=\"{{ expRows }}\" foot=\"76 of 78 founders. Median 12 years, longest 26.\" hint-size=\"100%,280px\"><\u002Fdc-import>\n        <dc-import name=\"LookbackChartDark\" title=\"How many ventures deep\" note=\"Counting prior companies where the founder held a founder, co-founder or chief-executive role.\" rows=\"{{ ventRows }}\" foot=\"35 of 78 have founded before. Eight are three or more ventures deep.\" hint-size=\"100%,280px\"><\u002Fdc-import>\n        <dc-import name=\"LookbackChartDark\" title=\"Institutes on the roster\" note=\"A founder can appear in more than one row, so these do not sum to the cohort.\" rows=\"{{ alumRows }}\" foot=\"49 of the 69 founders with an education section carry at least one marquee institute. Nine list none and are excluded from this denominator.\" hint-size=\"100%,340px\"><\u002Fdc-import>\n        <dc-import name=\"LookbackChartDark\" title=\"Building in a field they worked in\" note=\"Whether the founder's prior professional experience sits in the same industry as the company.\" rows=\"{{ domainRows }}\" foot=\"26 of the 37 companies have at least one founder from inside the industry. Eleven have none.\" hint-size=\"100%,340px\"><\u002Fdc-import>\n      <\u002Fdiv>\n\n      <div style=\"font-size:15px; line-height:1.74; color:#a1a1aa; padding:26px 0 0; max-width:74ch; text-wrap:pretty\"><span style=\"color:#f4f4f5\">Where they worked matters more than where they studied.<\u002Fspan> Twenty-nine of seventy-eight carry a global or big-technology employer and twenty-seven an Indian unicorn. The tally under-reads defence: three of Zoppler Systems' four founders spent between nine and fourteen years at Bharat Electronics, and a fourth was a Scientist C at DRDO's radar lab, which no list of startup employers will ever surface.<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"p5\" style=\"padding:clamp(74px,10vw,118px) 0 0\">\n      <div style=\"height:1px; background:#27272a\"><\u002Fdiv>\n      <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:clamp(26px,3.8vw,44px); line-height:1.12; letter-spacing:-.015em; color:#f4f4f5; padding:26px 0 0; text-wrap:pretty\"><span style=\"color:#eab308\">Six<\u002Fspan> founder archetypes<\u002Fdiv>\n      <div style=\"font-size:14.5px; line-height:1.72; color:#a1a1aa; padding:14px 0 0; max-width:80ch; text-wrap:pretty\">Each of the thirty-seven sits in exactly one archetype, chosen on the dominant founder's history. This is the judgement layer of the report and the only part not computed from a field. Click any archetype to filter the thirty-seven below.<\u002Fdiv>\n\n      <div style=\"display:grid; gap:1px; background:#27272a; border:1px solid #27272a; border-radius:4px; overflow:hidden; margin-top:30px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ a1.on }}\" style=\"appearance:none; border:0; margin:0; padding:0; font:inherit; color:inherit; background:none; text-align:left; cursor:pointer; background:{{ a1.bg }}; padding:24px 24px 22px; display:grid; grid-template-columns:minmax(0,268px) minmax(0,1fr); gap:10px clamp(22px,3vw,44px)\" style-hover=\"background:rgba(234,179,8,.05)\">\n          <div>\n            <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:24px; line-height:1.16; letter-spacing:-.015em; color:#f4f4f5\">Domain incumbent<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.16em; margin-top:10px; color:{{ a1.c }}\">{{ a1.count }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#a1a1aa\">Spent their working life inside the industry they now sell into, and left it to build the thing they could not buy.<\u002Fp>\n            <div style=\"margin-top:13px; font-size:13px; color:#a1a1aa; border-left:1px solid rgba(234,179,8,.45); padding-left:14px; line-height:1.68\"><b style=\"color:#f4f4f5; font-weight:500\">Zoppler Systems<\u002Fb> · three of four founders spent 9 to 14 years at Bharat Electronics, the fourth was a Scientist C at DRDO's radar lab. <b style=\"color:#f4f4f5; font-weight:500\">Staywell.Health<\u002Fb> · the insurance-distribution heads of Andromeda and Centrum, building insurtech.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ a2.on }}\" style=\"appearance:none; border:0; margin:0; padding:0; font:inherit; color:inherit; background:none; text-align:left; cursor:pointer; background:{{ a2.bg }}; padding:24px 24px 22px; display:grid; grid-template-columns:minmax(0,268px) minmax(0,1fr); gap:10px clamp(22px,3vw,44px)\" style-hover=\"background:rgba(234,179,8,.05)\">\n          <div>\n            <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:24px; line-height:1.16; letter-spacing:-.015em; color:#f4f4f5\">Senior operator going again<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.16em; margin-top:10px; color:{{ a2.c }}\">{{ a2.count }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#a1a1aa\">A decade or more of seniority at a company everyone knows, now on the other side of the table for the first time.<\u002Fp>\n            <div style=\"margin-top:13px; font-size:13px; color:#a1a1aa; border-left:1px solid rgba(234,179,8,.45); padding-left:14px; line-height:1.68\"><b style=\"color:#f4f4f5; font-weight:500\">Profound<\u002Fb> · Anuj Rathi, SVP Revenue and Growth at Swiggy then CPO at Jupiter, with Prashant Parashar, CTO at Zomato and VP Engineering at Ola. <b style=\"color:#f4f4f5; font-weight:500\">Hulp<\u002Fb> · Tarun Mathur, co-founder of PolicyBazaar for eighteen years.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ a3.on }}\" style=\"appearance:none; border:0; margin:0; padding:0; font:inherit; color:inherit; background:none; text-align:left; cursor:pointer; background:{{ a3.bg }}; padding:24px 24px 22px; display:grid; grid-template-columns:minmax(0,268px) minmax(0,1fr); gap:10px clamp(22px,3vw,44px)\" style-hover=\"background:rgba(234,179,8,.05)\">\n          <div>\n            <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:24px; line-height:1.16; letter-spacing:-.015em; color:#f4f4f5\">First-generation operator<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.16em; margin-top:10px; color:{{ a3.c }}\">{{ a3.count }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#a1a1aa\">Came up through a trade floor, a family business or a category they simply knew, rather than through a senior role at a company a fund would recognise.<\u002Fp>\n            <div style=\"margin-top:13px; font-size:13px; color:#a1a1aa; border-left:1px solid rgba(234,179,8,.45); padding-left:14px; line-height:1.68\"><b style=\"color:#f4f4f5; font-weight:500\">Digidukan<\u002Fb> · two founders two years out of college delivering construction material in minutes in Jaipur. <b style=\"color:#f4f4f5; font-weight:500\">KARM BABA<\u002Fb> · an FMCG export sales head and a self-taught engineer.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ a4.on }}\" style=\"appearance:none; border:0; margin:0; padding:0; font:inherit; color:inherit; background:none; text-align:left; cursor:pointer; background:{{ a4.bg }}; padding:24px 24px 22px; display:grid; grid-template-columns:minmax(0,268px) minmax(0,1fr); gap:10px clamp(22px,3vw,44px)\" style-hover=\"background:rgba(234,179,8,.05)\">\n          <div>\n            <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:24px; line-height:1.16; letter-spacing:-.015em; color:#f4f4f5\">Serial founder compounding<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.16em; margin-top:10px; color:{{ a4.c }}\">{{ a4.count }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0; font-size:14.5px; line-height:1.7; color:#a1a1aa\">Two or more prior ventures behind them. The first cheque here is a vote on the operator, not the idea.<\u002Fp>\n            <div style=\"margin-top:13px; font-size:13px; color:#a1a1aa; border-left:1px solid rgba(234,179,8,.45); padding-left:14px; line-height:1.68\"><b style=\"color:#f4f4f5; font-weight:500\">Scrubsy<\u002Fb> · four founders, three with a prior company. <b style=\"color:#f4f4f5; font-weight:500\">Pruf<\u002Fb> · Himi Khandelwal on her third venture after Virgio, CoinSwitch and Disney.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ a5.on }}\" style=\"appearance:none; border:0; margin:0; padding:0; font:inherit; color:inherit; background:none; text-align:left; cursor:pointer; background:{{ a5.bg }}; padding:24px 24px 22px; display:grid; grid-template-columns:minmax(0,268px) minmax(0,1fr); gap:10px clamp(22px,3vw,44px)\" style-hover=\"background:rgba(234,179,8,.05)\">\n          <div>\n            <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:24px; line-height:1.16; letter-spacing:-.015em; color:#f4f4f5\">Young tea or:#f4f4f5; padding:26px 0 0; text-wrap:pretty\">The whole register<\u002Fdiv>\n      <div style=\"font-size:14.5px; line-height:1.72; color:#a1a1aa; padding:14px 0 0; max-width:80ch; text-wrap:pretty\">All ninety-five events, the population every number in this issue is drawn from.<\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:#27272a; border:1px solid #27272a; border-radius:4px 4px 0 0; border-bottom:0; margin-top:26px\">\n        <sc-for list=\"{{ regStats }}\" as=\"rs\" hint-placeholder-count=\"4\">\n          <div style=\"background:#101014; padding:16px 18px\">\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.16em; color:#a1a1aa\">{{ rs.k }}<\u002Fdiv>\n            <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:30px; line-height:1.04; margin-top:8px; letter-spacing:-.022em; color:{{ rs.c }}\">{{ rs.v }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:14px 16px; border:1px solid #27272a; border-bottom:0; background:rgba(9,9,11,.5)\">\n        <input type=\"search\" placeholder=\"Search all 95 events\" value=\"{{ regQ }}\" sc-camel-on-input=\"{{ onRegQ }}\" style=\"all:unset; flex:1; min-width:200px; font-size:13.5px; color:#f4f4f5; background:#09090b; border:1px solid #27272a; border-radius:3px; padding:9px 13px\">\n        <div style=\"display:flex; gap:6px; flex-wrap:wrap\">\n          <sc-for list=\"{{ regBtns }}\" as=\"rb\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ rb.on }}\" style=\"all:unset; cursor:pointer; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.12em; padding:8px 15px; border-radius:100px; background:{{ rb.bg }}; color:{{ rb.fg }}; border:1px solid {{ rb.bd }}; white-space:nowrap\">{{ rb.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #27272a; border-radius:0 0 4px 4px; background:linear-gradient(180deg,rgba(31,31,35,.72),rgba(19,19,22,.4)); overflow:auto; max-height:660px\">\n        <div style=\"min-width:1000px\">\n          <div style=\"display:grid; grid-template-columns:44px 156px 92px 88px 150px minmax(170px,1fr) 118px 76px; border-bottom:1px solid #27272a; background:#101014; position:sticky; top:0; z-index:2\">\n            <sc-for list=\"{{ regCols }}\" as=\"rh\" hint-placeholder-count=\"8\">\n              <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.14em; color:#a1a1aa; padding:13px 12px; text-align:{{ rh.align }}\">{{ rh.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-for list=\"{{ regRows }}\" as=\"er\" hint-placeholder-count=\"16\">\n            <div style=\"display:grid; grid-template-columns:44px 156px 92px 88px 150px minmax(170px,1fr) 118px 76px; border-bottom:1px solid rgba(39,39,42,.55); background:{{ er.bg }}; font-size:12.5px; align-items:center; border-left:2px solid {{ er.edge }}\" style-hover=\"background:rgba(234,179,8,.06)\">\n              <div style=\"padding:10px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; color:#a1a1aa; text-align:right\">{{ er.n }}<\u002Fdiv>\n              <div style=\"padding:10px 12px; color:#f4f4f5; font-weight:500\">{{ er.company }}<\u002Fdiv>\n              <div style=\"padding:10px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#a1a1aa\">{{ er.date }}<\u002Fdiv>\n              <div style=\"padding:10px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; font-variant-numeric:tabular-nums; text-align:right; color:{{ er.amtColor }}\">{{ er.amt }}<\u002Fdiv>\n              <div style=\"padding:10px 12px; color:#a1a1aa\">{{ er.stage }}<\u002Fdiv>\n              <div style=\"padding:10px 12px; color:#a1a1aa\">{{ er.lead }}<\u002Fdiv>\n              <div style=\"padding:10px 12px; color:#a1a1aa\">{{ er.city }}<\u002Fdiv>\n              <div style=\"padding:10px 12px\"><span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.12em; color:{{ er.fiColor }}\">{{ er.fi }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px; line-height:1.6; color:#a1a1aa; margin-top:14px; max-width:86ch\">{{ regFoot }}<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"p8\" style=\"padding:clamp(74px,10vw,118px) 0 0\">\n      <div style=\"height:2px; background:linear-gradient(90deg,#eab308,rgba(234,179,8,.08))\"><\u002Fdiv>\n      <div style=\"background:radial-gradient(120% 130% at 8% 0%, rgba(234,179,8,.11) 0%, rgba(234,179,8,0) 58%), linear-gradient(152deg,#1d1d21 0%,#131316 72%); border:1px solid #27272a; border-top:0; padding:clamp(28px,4.5vw,56px)\">\n\n        <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.2em; color:#eab308\">THE PART WE HELD BACK<\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:clamp(30px,4vw,62px); align-items:start; margin-top:clamp(22px,3vw,32px)\">\n\n          <div>\n            <div style=\"display:flex; align-items:baseline; gap:clamp(8px,1.2vw,16px); font-family:'Instrument Serif',ui-serif,Georgia,serif; line-height:.82\">\n              <span style=\"font-size:clamp(76px,10.4vw,132px); color:#eab308; letter-spacing:-.04em; text-shadow:0 0 60px rgba(234,179,8,.3)\">25<\u002Fspan>\n              <span style=\"font-size:clamp(30px,4vw,52px); color:#a1a1aa; letter-spacing:-.02em\">of the 37<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:clamp(18px,2vw,25px); line-height:1.36; letter-spacing:-.01em; color:#f4f4f5; padding:24px 0 0; max-width:31ch; text-wrap:pretty\">were already on Startt before their round was announced, at a median <span style=\"color:#eab308\">96 days<\u002Fspan> of lead.<\u002Fdiv>\n            <div style=\"font-size:13.5px; line-height:1.74; color:#a1a1aa; padding:16px 0 0; max-width:52ch; text-wrap:pretty\">Measured, not asserted. A live pull of 7,144 founders on 7 September 2026, matched on five independent signals: company name, registered entity, founder name, LinkedIn slug and website domain. Two or more confirms. A catch requires the Startt record to predate the announcement date.<\u002Fdiv>\n\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:1px; background:#27272a; border:1px solid #27272a; margin-top:26px\">\n              <sc-for list=\"{{ act1Stats }}\" as=\"as\" hint-placeholder-count=\"4\">\n                <div style=\"background:rgba(9,9,11,.5); padding:15px 16px\">\n                  <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.16em; color:#a1a1aa\">{{ as.k }}<\u002Fdiv>\n                  <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:27px; line-height:1.04; margin-top:8px; letter-spacing:-.022em; color:{{ as.c }}\">{{ as.v }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"font-size:13px; line-height:1.72; color:#a1a1aa; padding:20px 0 0; max-width:52ch; text-wrap:pretty\">The other <span style=\"color:#f4f4f5\">twelve were not held at all<\u002Fspan>, verified absent rather than assumed: UN:BLOC, Profound, Hulp, Echovane, Discovered Materials, Quarkitech, Invisel, KARM BABA, Digidukan, Ekatra, Neuromod Aqua and Biryani Bees. None of the thirty-seven were added after the round.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"display:flex; align-items:baseline; gap:14px\">\n              <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.18em; color:#eab308; white-space:nowrap\">WHICH SIGNAL FOUND THEM FIRST<\u002Fspan>\n              <span style=\"flex:1; height:1px; background:#27272a\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 40px 62px; gap:0 12px; margin-top:16px; align-items:center\">\n              <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.14em; color:#a1a1aa; padding:0 0 8px\">CHANNEL<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.14em; color:#a1a1aa; text-align:right; padding:0 0 8px\">FOUND<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:.14em; color:#a1a1aa; text-align:right; padding:0 0 8px\">MEDIAN<\u002Fdiv>\n              <sc-for list=\"{{ channels }}\" as=\"cn\" hint-placeholder-count=\"9\">\n                <div style=\"grid-column:1 / -1; height:1px; background:#27272a\"><\u002Fdiv>\n                <div style=\"padding:11px 0; font-size:13.5px; color:{{ cn.fg }}\">{{ cn.name }}<\u002Fdiv>\n                <div style=\"padding:11px 0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; font-variant-numeric:tabular-nums; text-align:right; color:{{ cn.numColor }}\">{{ cn.n }}<\u002Fdiv>\n                <div style=\"padding:11px 0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; font-variant-numeric:tabular-nums; text-align:right; color:{{ cn.fg }}\">{{ cn.lead }}<\u002Fdiv>\n                <div style=\"grid-column:1 / -1; height:{{ cn.barBox }}\"><div style=\"height:3px; width:{{ cn.w }}; background:linear-gradient(90deg,rgba(234,179,8,.5),#eab308); border-radius:2px\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"grid-column:1 / -1; height:1px; background:#27272a\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px; line-height:1.7; color:#a1a1aa; padding:16px 0 0; max-width:46ch; text-wrap:pretty\">Three channels produced nothing in August. They are shown at zero rather than dropped, because one month is not a measure of a channel.<\u002Fdiv>\n\n            <div style=\"border:1px solid rgba(234,179,8,.28); background:rgba(234,179,8,.05); padding:18px 20px; margin-top:24px\">\n              <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9.5px; letter-spacing:.16em; color:#eab308\">BEFORE THE COMPANY HAD A NAME<\u002Fdiv>\n              <div style=\"font-size:13.5px; line-height:1.74; color:#e4e4e7; margin-top:11px; text-wrap:pretty\">Kily and Pruf were both held under the name <b style=\"font-weight:500; color:#f4f4f5\">Stealth<\u002Fb>. Startt had the founder before the company had a public one, matched on founder name and LinkedIn slug. Tross was held as <b style=\"font-weight:500; color:#f4f4f5\">Ayden<\u002Fb>, the name it carried before it renamed.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:clamp(22px,3vw,44px); align-items:center; margin-top:clamp(34px,4.4vw,52px); padding-top:clamp(28px,3.6vw,40px); border-top:1px solid #27272a\">\n          <div>\n            <div style=\"font-family:'Instrument Serif',ui-serif,Georgia,serif; font-size:clamp(22px,2.7vw,33px); line-height:1.16; letter-spacing:-.018em; color:#f4f4f5; max-width:26ch; text-wrap:pretty\">Startt tracks founders basis build signals from 9+ real time sources<\u002Fdiv>\n            <div style=\"font-size:14px; line-height:1.72; color:#a1a1aa; margin-top:14px; max-width:50ch; text-wrap:pretty\">7,150+ founder profiles, 300+ added every week, refreshed daily.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px; align-items:flex-start\">\n            <button type=\"button\" style=\"appearance:none; border:1px solid #eab308; margin:0; font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:10px; padding:15px 28px; border-radius:100px; font-size:16px; font-weight:500; background:#eab308; color:#09090b; white-space:nowrap\">Book a call for a product demo <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">→<\u002Fspan><\u002Fbutton>\n            <a href=\"mailto:founder@startt.in\" style=\"display:inline-flex; align-items:center; gap:9px; padding:13px 25px; border:1px solid #27272a; border-radius:100px; font-size:15px; font-weight:500; color:#a1a1aa; white-space:nowrap\" style-hover=\"color:#eab308; border-color:rgba(234,179,8,.45)\">Or write to us at founder@startt.in<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"padding:clamp(56px,7vw,86px) 0 0\">\n      <div style=\"height:1px; background:#27272a\"><\u002Fdiv>\n      <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:24px clamp(24px,4vw,48px); flex-wrap:wrap; padding:clamp(30px,4vw,40px) 0 0\">\n        <div style=\"display:flex; align-items:center; gap:16px\">\n          <img src=\"c4d4dcb8-9370-4746-94c2-24b99bbdc008\" alt=\"Startt\" style=\"display:block; width:auto; height:40px\">\n          <span style=\"display:flex; flex-direction:column; gap:9px\">\n            <span style=\"font-size:14px; font-weight:600; letter-spacing:.3em; color:#f4f4f5\">STARTT LOOKBACK<\u002Fspan>\n            <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; letter-spacing:.17em; color:#a1a1aa\">ISSUE 01 &nbsp;·&nbsp; 1 TO 31 AUGUST 2026 &nbsp;·&nbsp; FX AT INR 90 PER USD<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <a href=\"#top\" style=\"display:inline-flex; align-items:center; gap:10px; padding:13px 24px; border:1px solid rgba(234,179,8,.45); border-radius:100px; font-size:16px; font-weight:500; color:#eab308; white-space:nowrap; transition:background .15s ease, border-color .15s ease\" style-hover=\"border-color:#eab308; background:rgba(234,179,8,.1)\">Back to the top <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">↑<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cards&quot;,&quot;table&quot;],&quot;default&quot;:&quot;cards&quot;,&quot;tsType&quot;:&quot;'cards'|'table'&quot;,&quot;section&quot;:&quot;Cohort explorer&quot;}}\">\nconst D = () => (typeof window !== 'undefined' && window.LOOKBACK) || null;\nconst f1 = n => (Math.round(n * 10) / 10).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });\n\nconst SECTIONS = [\n  ['01', 'The month, counted whole', '95 EVENTS', 'p1', 'Every event in the month, and where the capital went.'],\n  ['02', 'The first-cheque cohort', '37 ROUNDS', 'p2', 'What a first institutional round means here, and what it was worth.'],\n  ['03', 'What kind of company', '16.8 MO', 'p3', 'Sector, age at funding, team size, registered city.'],\n  ['04', 'What kind of founder', '78 PROFILED', 'p4', 'Career length, ventures deep, institutes, domain fit.'],\n  ['05', 'Six founder archetypes', '6 SHAPES', 'p5', 'The judgement layer, with the evidence behind each call.'],\n  ['06', 'All thirty-seven companies', '37 ROWS', 'p6', 'Every company with its archetype, founders and cheque. Searchable.'],\n  ['07', 'The whole register', '95 ROWS', 'p7', 'All ninety-five events, filterable.'],\n  ['08', 'The part we held back', '25 OF 37', 'p8', 'What Startt already held, and how early.']\n];\n\nclass Component extends DCLogic {\n  state = { cols: 1, t: 0, prog: 0, act: 0, hov: null, q: '', arch: 'All', view: null, sort: 'company', dir: 1, open: null, regQ: '', regF: 'all' };\n\n  componentDidMount() {\n    const t0 = performance.now(), dur = 1300;\n    const step = () => {\n      const p = Math.min(1, (performance.now() - t0) / dur);\n      this.setState({ t: 1 - Math.pow(1 - p, 3) });\n      if (p < 1) requestAnimationFrame(step);\n    };\n    if (document.visibilityState === 'visible') requestAnimationFrame(step);\n    else this.setState({ t: 1 });\n    // rAF is paused in background tabs; guarantee the final figures regardless\n    this._settle = setTimeout(() => { if (this.state.t < 1) this.setState({ t: 1 }); }, 1800);\n    this._scroll = () => {\n      const h = document.documentElement, max = h.scrollHeight - h.clientHeight;\n      let act = 0;\n      for (let i = 0; i < SECTIONS.length; i++) {\n        const n = document.getElementById(SECTIONS[i][3]);\n        if (n && n.getBoundingClientRect().top <= 150) act = i + 1;\n      }\n      this.setState({ prog: max > 0 ? Math.min(1, h.scrollTop / max) : 0, act });\n    };\n    this._key = e => { if (e.key === 'Escape' && this.state.open) this.setState({ open: null }); };\n    // the detail panel must open below the whole row, so we need the grid's real column count\n    this._measure = () => {\n      const g = document.getElementById('cardGrid');\n      if (!g) return;\n      const n = getComputedStyle(g).gridTemplateColumns.split(' ').filter(Boolean).length;\n      if (n && n !== this.state.cols) this.setState({ cols: n });\n    };\n    window.addEventListener('scroll', this._scroll, { passive: true });\n    window.addEventListener('keydown', this._key);\n    window.addEventListener('resize', this._measure);\n    this._measure();\n    if (!D()) this._retry = setInterval(() => { if (D()) { clearInterval(this._retry); this.forceUpdate(); } }, 120);\n  }\n  componentDidUpdate() { if (this._measure) this._measure(); }\n  componentWillUnmount() {\n    window.removeEventListener('s k ? 'rgba(234,179,8,.12)' : 'transparent', fg: view === k ? '#eab308' : '#a1a1aa',\n      bd: view === k ? 'rgba(234,179,8,.45)' : '#27272a', on: () => this.setState({ view: k })\n    }));\n    vals.q = this.state.q;\n    vals.onQ = e => this.setState({ q: e.target.value, open: null });\n    vals.onClose = () => this.setState({ open: null });\n\n    const rows = this.filtered();\n    vals.resultCount = (rows.length === 37 ? 'ALL 37' : rows.length + ' OF 37');\n    const chequeOf = r => r.usd_mn == null ? 'n/d' : this.money(r.usd_mn);\n    const ageOf = r => r.age_months == null ? '\\u2014' : f1(r.age_months) + ' mo';\n    const openName = this.state.open;\n\n    const cols = Math.max(1, this.state.cols);\n    const openIdx = rows.findIndex(r => r.company === openName);\n    // panel hangs off the last card in the open card's row, so its row-mates stay put\n    const panelIdx = openIdx < 0 ? -1 : Math.min(Math.floor(openIdx / cols) * cols + cols - 1, rows.length - 1);\n    const byCo = (d.act1 || {}).byCompany || {};\n    vals.cards = rows.map((r, i) => {\n      const isOpen = openName === r.company;\n      const a = byCo[r.company] || {};\n      const held = !!a.caught;\n      return {\n        showPanel: i === panelIdx,\n        detail: panelIdx >= 0 && i === panelIdx ? this.detailFor(rows[openIdx]) : null,\n        company: r.company, arch: r.archetype.toUpperCase(),\n        cheque: chequeOf(r), chequeColor: r.usd_mn == null ? '#a1a1aa' : '#eab308',\n        sector: r.sector + '  \\u00b7  ' + r.bucket,\n        founderLine: r.founders.map(f => f.name).join(', '),\n        metaLine: [r.city, ageOf(r), r.founders.length + (r.founders.length === 1 ? ' FOUNDER' : ' FOUNDERS')].join('  \\u00b7  ').toUpperCase(),\n        heldDot: held ? '#eab308' : '#3f3f46',\n        heldFg: held ? '#eab308' : '#a1a1aa',\n        heldLabel: held ? 'ON STARTT ' + a.days + 'D EARLY' : 'NOT HELD',\n        bg: isOpen ? 'rgba(234,179,8,.07)' : (held ? 'linear-gradient(180deg,rgba(37,32,1 FIRST INSTITUTIONAL 37'], ['rest', 'FOLLOW-ON 58']].map(([k, label]) => ({\n      label, bg: rf === k ? '#eab308' : 'transparent', fg: rf === k ? '#09090b' : '#a1a1aa',\n      bd: rf === k ? '#eab308' : '#27272a', on: () => this.setState({ regF: k })\n    }));\n    vals.regCols = [['#', 'right'], ['COMPANY', 'left'], ['ANNOUNCED', 'left'], ['RAISED', 'right'],\n      ['STAGE', 'left'], ['LEAD INVESTOR', 'left'], ['CITY', 'left'], ['FIRST ROUND', 'left']]\n      .map(([label, align]) => ({ label, align }));\n    const full = {};\n    d.rows.forEach(r => { if (r.lead) full[r.company] = r.lead; });\n    const cut = (s, n) => !s ? s : (s.length === n ? s + '\\u2026' : s);\n    vals.regRows = regAll.map(e => ({\n      n: String(e.n), company: e.company,\n      date: /^\\d/.test(e.date) ? new Date(e.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) : 'n/d',\n      amt: e.usd == null ? 'n/d' : this.money(e.usd),\n      amtColor: e.usd == null ? '#a1a1aa' : '#f4f4f5',\n      stage: cut(e.stage, 22) || 'not disclosed',\n      lead: full[e.company] || (e.lead && e.lead !== 'Not published' ? cut(e.lead, 30) : '\\u2014'),\n      city: e.city === 'not published' ? '\\u2014' : cut(e.city, 16),\n      fi: e.coh === 'Yes' ? 'FIRST' : '\\u2014',\n      fiColor: e.coh === 'Yes' ? '#eab308' : '#a1a1aa',\n      bg: e.coh === 'Yes' ? 'rgba(234,179,8,.045)' : 'transparent',\n      edge: e.coh === 'Yes' ? 'rgba(234,179,8,.5)' : 'transparent'\n    }));\n    const maxCh = Math.max.apply(null, d.act1.channels.map(c => c[1])) || 1;\n    vals.channels = d.act1.channels.map(([name, n, lead]) => ({\n      name, n: String(n), lead: lead == null ? '\\u2014' : lead + 'd',\n      fg: n ? '#e4e4e7' : '#a1a1aa', numColor: n ? '#eab308' : '#a1a1aa',\n      w: (n / maxCh * 100 * t).toFixed(1) + '%', barBox: n ? '3px' : '0px'\n    }));\n\n    vals.regFoot = (regAll.length === 95 ? 'All ninety-five events' : 'Showing ' + regAll.length + ' of 95 events') +\n      '. Amounts converted at INR 90 per USD; eleven disclosed none. Stage is the label as published, which is why it is not evidence of a first raise.';\n\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
